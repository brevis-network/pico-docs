name: Deploy mdBook site to GitHub Pages

on:
  push:
    branches: ["deploy"]  
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: '0.5.0-beta.1'  # 建议指定一个稳定版本

      - name: Build with mdBook
        run: | 
            mdbook clean
            mdbook build
            
      - name: Copy CNAME to book directory
        run: cp CNAME ./book/CNAME

      - name: Include custom tab icon in site output
        run: cp theme/favicon.png book/favicon.png

      - name: Override mdBook default favicon link
        run: |
          find book -name "*.html" -type f -exec sed -i 's#<link rel="shortcut icon" href="[^"]*">#<link rel="shortcut icon" href="/favicon.png" type="image/png">#g' {} +

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book 
